<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Community Board</title>
  <meta name="theme-color" content="#e4e9f2" />
  <meta name="description" content="Members, issues, and tasks for a community." />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Community" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="neu topbar">
    <a href="#/issues" class="brand">
      <span class="logo">◈</span> Community Board
    </a>
    <nav>
      <a href="#/issues" data-nav="issues">Issues</a>
      <a href="#/members" data-nav="members">Members</a>
    </nav>
  </header>

  <main id="app"></main>

  <!-- Reusable modal -->
  <dialog id="modal" class="neu modal">
    <form method="dialog" id="modal-form">
      <h2 id="modal-title"></h2>
      <div id="modal-body"></div>
      <p class="form-error" id="modal-error"></p>
      <div class="modal-actions">
        <button type="button" class="btn ghost" id="modal-cancel">Cancel</button>
        <button type="submit" class="btn primary" id="modal-submit">Save</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="neu toast" role="status"></div>

  <script src="/app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("/sw.js"));
    }
  </script>
</body>
</html>
